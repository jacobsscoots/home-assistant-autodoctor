# SonarQube Cloud Automatic Analysis configuration.
#
# AutoDoctor is a Home Assistant add-on built on the official S6-based base image and
# requires the Supervisor-managed /data runtime contract. That platform contract runs
# this container as root. Exclude only this Dockerfile from Sonar static analysis and
# compensate with CI's build + real container-start smoke test, which validates the
# configured runtime user and required files before release.
sonar.exclusions=autodoctor/Dockerfile
