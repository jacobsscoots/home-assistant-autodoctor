name: Temporary backup-first feature validation
on:
  push:
    branches: ['feat/backup-first-diagnostic-repair']
    paths: ['.github/workflows/backup-repair-validate.yml']
permissions:
  contents: write
jobs:
  integrate-test:
    if: github.repository == 'jacobsscoots/home-assistant-autodoctor'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify and apply exact reviewed source
        run: python .github/apply-backup-integration.py
      - name: Install hash-locked wheels
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r autodoctor/requirements-test.txt
      - name: Compile and validate configuration
        run: |
          python -m compileall -q autodoctor/app autodoctor/tests custom_components/autodoctor_private_resolver
          python - <<'PY'
          from pathlib import Path
          import json, yaml
          for name in ('repository.yaml', 'autodoctor/config.yaml', 'autodoctor/translations/en.yaml'):
              yaml.safe_load(Path(name).read_text())
          json.loads(Path('custom_components/autodoctor_private_resolver/manifest.json').read_text())
          PY
          git diff --check
      - name: Full tests without exclusions
        run: python -m pytest -q autodoctor/tests
      - name: Run existing container build smoke and ARM64-wheel checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, yaml
          config = yaml.safe_load(Path('.github/workflows/ci.yml').read_text())
          command = next(step['run'] for step in config['jobs']['container-build']['steps'] if step.get('name') == 'Build and start-test Home Assistant app image')
          subprocess.run(['bash', '-euo', 'pipefail', '-c', command], check=True)
          PY
      - name: Remove temporary staging and publish validated feature branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/backup-first-diagnostic-repair'
          git rm -- .github/backup-repair.01.b64 .github/backup-repair.02.b64 .github/workflows/backup-repair-source.yml .github/backup-integrate.json .github/backup-source-sha256.json .github/apply-backup-integration.py .github/workflows/backup-repair-validate.yml
          git add README.md autodoctor
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate verified backup-first repairs and bounded retention (v0.5.0)'
          git push origin HEAD:refs/heads/feat/backup-first-diagnostic-repair
