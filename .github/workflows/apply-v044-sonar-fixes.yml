name: Apply v0.4.4 Sonar hardening

on:
  push:
    branches:
      - fix/v0.4.4-sonar-hardening
    paths:
      - '.github/workflows/apply-v044-sonar-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/v0.4.4-sonar-hardening
      - name: Apply focused Sonar fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}, got {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          # Reliability S7497: cancel child tasks, but let cancellation of the caller propagate naturally.
          replace_once(
              'autodoctor/app/autodoctor/case_engine.py',
              '''        finally:\n            if triage_task is not None:\n                triage_task.cancel()\n                try:\n                    await triage_task\n                except asyncio.CancelledError:\n                    pass\n''',
              '''        finally:\n            if triage_task is not None:\n                triage_task.cancel()\n                await asyncio.gather(triage_task, return_exceptions=True)\n''',
          )
          replace_once(
              'autodoctor/app/autodoctor/repair_executor.py',
              '''        for task in tasks:\n            try:\n                await task\n            except asyncio.CancelledError:\n                pass\n''',
              '''        if tasks:\n            await asyncio.gather(*tasks, return_exceptions=True)\n''',
          )
          replace_once(
              'autodoctor/app/autodoctor/mcp_backend.py',
              '''        task.cancel()\n        try:\n            await task\n        except asyncio.CancelledError:\n            pass\n''',
              '''        task.cancel()\n        await asyncio.gather(task, return_exceptions=True)\n''',
          )

          # Maintainability S1192: stable constants for repeated SQL/auth text.
          p = Path('autodoctor/app/autodoctor/cases.py')
          text = p.read_text()
          anchor = '''_ACTIVE_STATUSES = {\n    "new",\n    "investigating",\n    "diagnosed",\n    "repair_available",\n    "needs_user_action",\n    "verifying",\n    "reopened",\n}\n'''
          if anchor not in text:
              raise SystemExit('cases.py constants anchor missing')
          text = text.replace(anchor, anchor + '\n_CASE_BY_PATTERN_SQL = "SELECT * FROM incident_cases WHERE pattern_key = ?"\n', 1)
          text = text.replace('"SELECT * FROM incident_cases WHERE pattern_key = ?"', '_CASE_BY_PATTERN_SQL')
          p.write_text(text)

          p = Path('autodoctor/app/autodoctor/mcp_backend.py')
          text = p.read_text()
          anchor = '_LOG = logging.getLogger(__name__)\n'
          if text.count(anchor) != 1:
              raise SystemExit('mcp logger anchor missing')
          text = text.replace(anchor, anchor + '\n_MISSING_AUTH_ERROR = "MCP URL/authentication missing"\n', 1)
          text = text.replace('"MCP URL/authentication missing"', '_MISSING_AUTH_ERROR')
          p.write_text(text)

          # Maintainability S3776: split backlog triage into one-case validation/execution.
          p = Path('autodoctor/app/autodoctor/case_engine.py')
          text = p.read_text()
          start = text.index('    async def run_backlog_triage_cycle(self) -> int:\n')
          end = text.index('    async def _backlog_triage_loop(self) -> None:\n', start)
          replacement = '''    async def _triage_backlog_case(\n        self,\n        case: dict[str, Any],\n        by_fp: dict[str, dict[str, Any]],\n    ) -> bool:\n        fp = str(case.get("representative_fingerprint") or "")\n        row = by_fp.get(fp)\n        if not row:\n            self.backlog_triage_skipped += 1\n            return False\n\n        pattern_key = str(case.get("pattern_key") or "")\n        if str(row.get("pattern_key") or "") != pattern_key:\n            self.backlog_triage_skipped += 1\n            return False\n\n        event = self._event_from_incident_row(row)\n        if not self._should_process_event(event):\n            self.backlog_triage_skipped += 1\n            return False\n\n        family = incident_family(event.name, event.source)\n        if not await self._should_analyze(event, row, family):\n            return False\n\n        return await self._analyze_persisted_incident(\n            event=event,\n            fp=fp,\n            family=family,\n            pattern_key=pattern_key,\n            pattern_label=str(case.get("pattern_label") or row.get("pattern_label") or pattern_key),\n            row=row,\n            source="backlog_triage",\n        )\n\n    async def run_backlog_triage_cycle(self) -> int:\n        """Analyze persisted active cases without synthesizing or re-recording log events."""\n        self.backlog_triage_runs += 1\n        self.backlog_triage_last_run_at = datetime.now(tz=timezone.utc).timestamp()\n        if not self.settings.case_backlog_triage_enabled or isinstance(self.llm, NoProvider):\n            return 0\n\n        cases = await self._eligible_backlog_cases()\n        if not cases:\n            return 0\n        incident_rows = await self.store.list_recent(self.settings.max_incidents_retained)\n        by_fp = {str(row.get("fingerprint") or ""): row for row in incident_rows}\n        completed = 0\n        per_cycle = max(1, int(self.settings.case_backlog_triage_max_per_cycle))\n\n        for case in cases:\n            if completed >= per_cycle:\n                break\n            if await self._triage_backlog_case(case, by_fp):\n                completed += 1\n                self.backlog_triage_analyses += 1\n        return completed\n\n'''
          p.write_text(text[:start] + replacement + text[end:])

          # Maintainability S3776: separate backlog aggregation and legacy notification cleanup.
          p = Path('autodoctor/app/autodoctor/cases.py')
          text = p.read_text()
          start = text.index('    async def reconcile_backlog(self, incident_rows: list[dict[str, Any]]) -> dict[str, int]:\n')
          end = text.index('    def _merge_backlog_sync(self, groups: list[dict[str, Any]]) -> None:\n', start)
          replacement = '''    @staticmethod\n    def _aggregate_backlog_row(groups: dict[str, dict[str, Any]], row: dict[str, Any]) -> str:\n        fp = str(row.get("fingerprint") or "")\n        key = str(row.get("pattern_key") or f"fingerprint/{fp}")\n        row_first = float(row.get("first_seen") or 0)\n        row_last = float(row.get("last_seen") or 0)\n        item = groups.setdefault(\n            key,\n            {\n                "pattern_key": key,\n                "pattern_label": str(row.get("pattern_label") or key),\n                "family": "unknown",\n                "first_seen": row_first,\n                "last_seen": row_last,\n                "occurrences": 0,\n                "fingerprints": 0,\n                "representative_fingerprint": fp,\n            },\n        )\n        if row_first:\n            item["first_seen"] = min(float(item["first_seen"] or row_first), row_first)\n        if row_last >= float(item["last_seen"] or 0):\n            item["last_seen"] = row_last\n            item["representative_fingerprint"] = fp\n        item["occurrences"] += int(row.get("occurrences") or 0)\n        item["fingerprints"] += 1\n        return fp\n\n    async def _dismiss_legacy_notification(self, fingerprint: str) -> bool:\n        if not fingerprint or not self.notifications_enabled:\n            return False\n        try:\n            await self.ha.dismiss_notification(f"autodoctor_{fingerprint}")\n            return True\n        except Exception:\n            # Backlog cleanup must never stop incident monitoring.\n            return False\n\n    async def reconcile_backlog(self, incident_rows: list[dict[str, Any]]) -> dict[str, int]:\n        """Group historical exact incidents and retire only AutoDoctor's legacy notices."""\n        groups: dict[str, dict[str, Any]] = {}\n        dismissed = 0\n        for row in incident_rows:\n            fingerprint = self._aggregate_backlog_row(groups, row)\n            dismissed += int(await self._dismiss_legacy_notification(fingerprint))\n\n        async with self._lock:\n            await asyncio.to_thread(self._merge_backlog_sync, list(groups.values()))\n\n        if self.notifications_enabled:\n            for key in groups:\n                await self.publish_case(key, force=True)\n        return {"cases": len(groups), "legacy_notifications_dismissed": dismissed}\n\n'''
          p.write_text(text[:start] + replacement + text[end:])

          # Maintainability S3776: profile-specific evidence collectors keep policy deterministic and focused.
          p = Path('autodoctor/app/autodoctor/investigator.py')
          text = p.read_text()
          start = text.index('    async def collect(self, event: LogEvent, family: str) -> dict[str, Any]:\n')
          replacement = '''    async def _collect_ha_mcp(\n        self, event: LogEvent, family: str, entities: list[str]\n    ) -> list[dict[str, Any]]:\n        reads: list[dict[str, Any]] = []\n        if self._looks_integration_or_system_failure(event):\n            reads.append(\n                await self._safe_call(\n                    "ha_get_system_health", {}, "targeted incident system health evidence"\n                )\n            )\n\n        for entity_id in entities[:3]:\n            reads.append(\n                await self._safe_call(\n                    "ha_get_state",\n                    {"entity_id": entity_id},\n                    "targeted incident entity state evidence",\n                )\n            )\n\n        if entities:\n            reads.append(\n                await self._safe_call(\n                    "ha_get_history",\n                    {"entity_ids": entities[:3], "start_time": "2h"},\n                    "targeted recent state history evidence",\n                )\n            )\n\n        automation_ids = [\n            entity.split(".", 1)[1]\n            for entity in entities\n            if entity.startswith("automation.")\n        ]\n        for automation_id in automation_ids[:2]:\n            reads.append(\n                await self._safe_call(\n                    "ha_get_automation_traces",\n                    {"automation_id": automation_id},\n                    "targeted automation trace evidence",\n                )\n            )\n\n        if family and family != "unknown":\n            reads.append(\n                await self._safe_call(\n                    "ha_get_integration",\n                    {"query": family},\n                    "targeted integration metadata evidence",\n                )\n            )\n        return reads\n\n    async def _collect_ganhammar(self, entities: list[str]) -> list[dict[str, Any]]:\n        reads: list[dict[str, Any]] = []\n        for entity_id in entities[:3]:\n            reads.append(\n                await self._safe_call(\n                    "get_state",\n                    {"entity_id": entity_id},\n                    "targeted incident entity state evidence",\n                )\n            )\n        return reads\n\n    async def collect(self, event: LogEvent, family: str) -> dict[str, Any]:\n        try:\n            health = await self.mcp.health()\n        except Exception:\n            return {"enabled": False, "reads": []}\n        if not health.get("enabled") or not health.get("connected"):\n            return {"enabled": bool(health.get("enabled")), "reads": []}\n\n        profile = str(health.get("server_profile") or "unknown")\n        entities = self.referenced_entities(event)\n        if profile == "ha-mcp":\n            reads = await self._collect_ha_mcp(event, family, entities)\n        elif profile == "ganhammar":\n            reads = await self._collect_ganhammar(entities)\n        else:\n            reads = []\n\n        return {\n            "enabled": True,\n            "server_profile": profile,\n            "selection": "deterministic-by-incident",\n            "referenced_entity_count": len(entities),\n            "reads": reads[:8],\n        }\n'''
          p.write_text(text[:start] + replacement)

          # Docker S6471: HA's supported base/S6 + Supervisor-managed /data require the root runtime here.
          # Keep the narrow, documented exception explicit rather than shipping an unverified USER change.
          p = Path('autodoctor/Dockerfile')
          text = p.read_text()
          text = text.replace(
              'USER ${APP_USER}\n',
              'USER ${APP_USER} # NOSONAR -- Home Assistant base/S6 and Supervisor-managed /data require root here.\n',
              1,
          )
          p.write_text(text)

          # Release metadata.
          replace_once(
              'autodoctor/app/autodoctor/__init__.py',
              'AUTODOCTOR_VERSION = "0.4.3"',
              'AUTODOCTOR_VERSION = "0.4.4"',
          )
          replace_once(
              'autodoctor/config.yaml',
              'version: "0.4.3"',
              'version: "0.4.4"',
          )
          PY

          python3 -m compileall -q autodoctor/app autodoctor/tests

          # Remove this one-shot patch workflow so it can never reach the release PR.
          rm .github/workflows/apply-v044-sonar-fixes.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: clear AutoDoctor Sonar findings for v0.4.4"
          git push origin HEAD:fix/v0.4.4-sonar-hardening
