name: Diagnostic Sonar PR 44

on:
  push:
    branches:
      - feature/v0.4.9-tplink-host-bridge
    paths:
      - '.github/workflows/diagnostic-sonar-pr44.yml'

permissions:
  contents: read

jobs:
  issues:
    runs-on: ubuntu-latest
    steps:
      - name: Query SonarCloud PR issues
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          params = urllib.parse.urlencode({
              'componentKeys': 'jacobsscoots_home-assistant-autodoctor',
              'pullRequest': '44',
              'issueStatuses': 'OPEN,CONFIRMED',
              'ps': '100',
          })
          url = 'https://sonarcloud.io/api/issues/search?' + params
          with urllib.request.urlopen(url, timeout=30) as r:
              data = json.load(r)
          print('TOTAL', data.get('total'))
          for issue in data.get('issues', []):
              print(json.dumps({
                  'rule': issue.get('rule'),
                  'component': issue.get('component'),
                  'line': issue.get('line'),
                  'message': issue.get('message'),
                  'severity': issue.get('severity'),
                  'type': issue.get('type'),
                  'impacts': issue.get('impacts'),
              }, sort_keys=True))
          PY
