name: AutoDoctor CI

on:
  push:
    branches:
      - main
    paths:
      - 'autodoctor/**'
      - '.github/workflows/ci.yml'
      - '.sonarcloud.properties'
  pull_request:
    paths:
      - 'autodoctor/**'
      - '.github/workflows/ci.yml'
      - '.sonarcloud.properties'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: >-
          python -m pip install
          pytest==9.1.1 pyyaml==6.0.3 aiohttp==3.14.3 httpx2==2.12.0 mcp==2.1.1
      - name: Compile Python
        run: python -m compileall -q autodoctor/app autodoctor/tests
      - name: Validate YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in (
              Path('repository.yaml'),
              Path('autodoctor/config.yaml'),
              Path('autodoctor/translations/en.yaml'),
          ):
              yaml.safe_load(path.read_text())
              print(f'OK: {path}')
          PY
      - name: Run tests
        run: python -m pytest -q autodoctor/tests

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and start-test Home Assistant app image
        run: |
          APP_VERSION="$(python3 - <<'PY'
          from pathlib import Path

          for line in Path('autodoctor/config.yaml').read_text().splitlines():
              if line.startswith('version:'):
                  print(line.split(':', 1)[1].strip().strip('"\''))
                  break
          else:
              raise SystemExit('version not found in autodoctor/config.yaml')
          PY
          )"
          test -n "$APP_VERSION"
          IMAGE="autodoctor-ci:$APP_VERSION"
          echo "Building AutoDoctor $APP_VERSION"
          docker build \
            --build-arg BUILD_VERSION="$APP_VERSION" \
            --build-arg BUILD_ARCH=amd64 \
            -t "$IMAGE" \
            autodoctor

          # A successful build does not validate Docker's configured USER. Actually create
          # and start a container so malformed USER directives fail CI before release.
          echo "Smoke-starting $IMAGE"
          docker run --rm --entrypoint /bin/sh "$IMAGE" -c '
            test "$(id -u)" = "0"
            test -r /app/main.py
            test -x /run.sh
          '
