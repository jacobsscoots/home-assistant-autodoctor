name: AutoDoctor CI

on:
  push:
    branches:
      - main
    paths:
      - 'autodoctor/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'autodoctor/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: >-
          python -m pip install --upgrade
          pytest pyyaml 'aiohttp>=3.10,<4' 'httpx2>=2.5,<3' 'mcp>=2,<3'
      - name: Compile Python
        run: python -m compileall -q autodoctor/app autodoctor/tests
      - name: Validate YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in (
              Path('repository.yaml'),
              Path('autodoctor/config.yaml'),
              Path('autodoctor/translations/en.yaml'),
          ):
              yaml.safe_load(path.read_text())
              print(f'OK: {path}')
          PY
      - name: Run tests
        run: python -m pytest -q autodoctor/tests

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build Home Assistant app image
        run: |
          docker build \
            --build-arg BUILD_VERSION=0.1.3 \
            --build-arg BUILD_ARCH=amd64 \
            autodoctor
