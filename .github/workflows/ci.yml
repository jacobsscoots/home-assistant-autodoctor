name: AutoDoctor CI

on:
  push:
    branches:
      - main
    paths:
      - 'autodoctor/**'
      - 'custom_components/**'
      - '.github/workflows/ci.yml'
      - '.sonarcloud.properties'
  pull_request:
    paths:
      - 'autodoctor/**'
      - 'custom_components/**'
      - '.github/workflows/ci.yml'
      - '.sonarcloud.properties'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r autodoctor/requirements-test.txt
      - name: Compile Python
        run: >-
          python -m compileall -q
          autodoctor/app autodoctor/tests custom_components/autodoctor_private_resolver
      - name: Validate YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import yaml
          for path in (
              Path('repository.yaml'),
              Path('autodoctor/config.yaml'),
              Path('autodoctor/translations/en.yaml'),
          ):
              yaml.safe_load(path.read_text())
              print(f'OK: {path}')
          manifest = Path('custom_components/autodoctor_private_resolver/manifest.json')
          json.loads(manifest.read_text())
          print(f'OK: {manifest}')
          PY
      - name: Run tests
        run: python -m pytest -q autodoctor/tests

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start-test Home Assistant app image
        run: |
          APP_VERSION="$(python3 - <<'PY'
          from pathlib import Path

          for line in Path('autodoctor/config.yaml').read_text().splitlines():
              if line.startswith('version:'):
                  print(line.split(':', 1)[1].strip().strip('"\''))
                  break
          else:
              raise SystemExit('version not found in autodoctor/config.yaml')
          PY
          )"
          test -n "$APP_VERSION"
          IMAGE="autodoctor-ci:$APP_VERSION"
          echo "Building AutoDoctor $APP_VERSION"
          docker build \
            --build-arg BUILD_VERSION="$APP_VERSION" \
            --build-arg BUILD_ARCH=amd64 \
            -t "$IMAGE" \
            autodoctor

          # A successful build does not validate Docker's configured USER. Actually create
          # and start a container so malformed USER directives fail CI before release.
          echo "Smoke-starting $IMAGE"
          docker run --rm --entrypoint /bin/sh "$IMAGE" -c '
            set -eu
            test "$(id -u)" = "0"
            test -r /app/main.py
            test -x /run.sh
            python3 -c "import aiohttp, httpx2; from mcp import Client"
          '

          # Confirm the same locked runtime dependencies also have Alpine ARM64 wheels.
          # Include the older musl ABI supported by Alpine; --platform matches explicit tags.
          # This downloads and checks hashes only; it does not claim an ARM64 smoke test.
          docker run --rm --entrypoint /bin/sh "$IMAGE" -c '
            set -eu
            python3 -m pip download --require-hashes --only-binary=:all: \
              --platform musllinux_1_2_aarch64 --platform musllinux_1_1_aarch64 \
              --dest /tmp/arm64-wheels -r /tmp/requirements.txt
          '
