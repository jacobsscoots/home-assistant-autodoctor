name: Temporary 72h fix workbench

on:
  push:
    branches: ['fix/72h-reliability-v0416']
    paths: ['.github/workflows/72h-fix-workbench.yml']

permissions:
  contents: write

jobs:
  prepare-and-test:
    if: github.repository == 'jacobsscoots/home-assistant-autodoctor' && github.ref == 'refs/heads/fix/72h-reliability-v0416'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Apply exact reviewed edits with hash guards
        run: python .github/72h-prepare.py
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r autodoctor/requirements-test.txt
      - name: Compile and validate metadata
        run: |
          python -m compileall -q autodoctor/app autodoctor/tests custom_components/autodoctor_private_resolver
          python - <<'PY'
          from pathlib import Path
          import json
          import yaml
          for name in ('repository.yaml', 'autodoctor/config.yaml', 'autodoctor/translations/en.yaml'):
              yaml.safe_load(Path(name).read_text())
          json.loads(Path('custom_components/autodoctor_private_resolver/manifest.json').read_text())
          PY
          git diff --check
      - name: Run complete suite without exclusions
        run: python -m pytest -q autodoctor/tests
      - name: Commit validated source to the fix branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/72h-reliability-v0416'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md autodoctor
          git diff --cached --check
          git commit -m 'Fix SQLite contention, template scoping and legacy warning (v0.4.16)'
          git push origin HEAD:refs/heads/fix/72h-reliability-v0416
