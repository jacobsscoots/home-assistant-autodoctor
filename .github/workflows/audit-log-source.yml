name: Temporary audit-log source snapshot
on:
  push:
    branches: ['fix/audit-log-json-repair']
    paths: ['.github/workflows/audit-log-source.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz --output=source.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-log-source
          path: source.tar.gz
          retention-days: 1
