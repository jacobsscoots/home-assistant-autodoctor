name: Temporary audit-log integration validation
on:
  push:
    branches: ['fix/audit-log-json-repair']
    paths: ['.github/workflows/apply-audit-log.yml']
permissions:
  contents: write
jobs:
  integrate-test:
    if: github.repository == 'jacobsscoots/home-assistant-autodoctor'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify and integrate exact tested source
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path.cwd().resolve()
          manifest = json.loads(Path('.github/audit-log-integration.json').read_text())
          prepared = {}
          for name, change in manifest['changes'].items():
              path = root / name
              if path.is_symlink() or not path.resolve().is_relative_to(root):
                  raise SystemExit('Invalid path')
              original = path.read_bytes()
              if hashlib.sha256(original).hexdigest() != change['before']:
                  raise SystemExit('Source changed: ' + name)
              lines = original.decode().splitlines(keepends=True)
              for start, end, replacement in reversed(change['edits']):
                  lines[start:end] = replacement.splitlines(keepends=True)
              updated = ''.join(lines).encode()
              if hashlib.sha256(updated).hexdigest() != change['after']:
                  raise SystemExit('Integration mismatch: ' + name)
              prepared[path] = updated
          for name, expected in manifest['new_files'].items():
              if hashlib.sha256((root / name).read_bytes()).hexdigest() != expected:
                  raise SystemExit('Transferred source mismatch: ' + name)
          for path, content in prepared.items():
              path.write_bytes(content)
          print('All source files match the locally tested version.')
          PY
      - name: Install locked wheels
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r autodoctor/requirements-test.txt
      - name: Compile validate and run full tests without exclusions
        run: |
          python -m compileall -q autodoctor/app autodoctor/tests
          python - <<'PY'
          from pathlib import Path
          import yaml
          for name in ('autodoctor/config.yaml', 'autodoctor/translations/en.yaml'):
              yaml.safe_load(Path(name).read_text())
          PY
          python -m pytest -q autodoctor/tests
          git diff --check
      - name: Publish tested branch without temporary tooling
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/audit-log-json-repair'
          git rm -- .github/workflows/audit-log-source.yml .github/workflows/apply-audit-log.yml .github/audit-log-integration.json
          git add README.md autodoctor
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate reviewed JSON/Base64 logger recipe and regression tests (v0.5.1)'
          git push origin HEAD:refs/heads/fix/audit-log-json-repair
