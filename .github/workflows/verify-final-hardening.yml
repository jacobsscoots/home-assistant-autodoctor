name: Verify final AutoDoctor hardening

on:
  push:
    branches:
      - fix/final-autodoctor-hardening
    paths:
      - "tools/apply_final_autodoctor_hardening.py"
      - ".github/workflows/verify-final-hardening.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/final-autodoctor-hardening

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: >-
          python -m pip install
          pytest==9.1.1 pyyaml==6.0.3 aiohttp==3.14.3 httpx2==2.12.0 mcp==2.1.1

      - name: Apply exact hardening patch
        run: python3 tools/apply_final_autodoctor_hardening.py

      - name: Compile Python
        run: python -m compileall -q autodoctor/app autodoctor/tests

      - name: Validate YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in (
              Path('repository.yaml'),
              Path('autodoctor/config.yaml'),
              Path('autodoctor/translations/en.yaml'),
          ):
              yaml.safe_load(path.read_text())
              print(f'OK: {path}')
          PY

      - name: Run full AutoDoctor tests
        run: python -m pytest -q autodoctor/tests

      - name: Remove temporary verifier
        run: |
          rm tools/apply_final_autodoctor_hardening.py
          rm .github/workflows/verify-final-hardening.yml

      - name: Commit verified hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed after verification."
            exit 0
          fi
          git commit -m "fix: harden AutoDoctor runtime boundaries"
          git push origin HEAD:fix/final-autodoctor-hardening
