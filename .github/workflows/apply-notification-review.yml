name: Temporary notification review integration
on:
  push:
    branches: ['feat/backup-first-diagnostic-repair']
    paths: ['.github/workflows/apply-notification-review.yml']
permissions:
  contents: write
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Apply source-hash-guarded review corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          edits = [
              ('autodoctor/app/autodoctor/backup_executor.py',
               'ee2bcc67267f27506fed145ea0af60143a50e4fffea5bb3e7f22cfcb721e4241',
               '7cbc104fba0eab2381d22ac445450955c91221e7fab69b346c842326ce316e3a',
               '        return await super().resume_pending_verifications()\n',
               '        for attempt in interrupted:\n            plan = await self.get_plan(attempt["plan_id"])\n            if plan is None:\n                continue\n            try:\n                await self.cases.publish_case(plan["pattern_key"], force=True)\n            except Exception:\n                _LOG.warning("Recovered repair hold needs notification reconciliation")\n'),
              ('autodoctor/app/autodoctor/case_lifecycle.py',
               '0b3c5826d6f2f1786e174b6d1920bfe8174a89d486b4c672b7837fcc598bef67',
               '5a2dda136c70094933a6c90afdb7f9b695a07ccdf64877fc10f6896c101d2108',
               '    async def publish_active_cases(self, *, force: bool = False) -> int:\n',
               '    async def publish_case(self, pattern_key: str, *, force: bool = False) -> bool:\n        """Synchronize the notice after an atomic status update, without rewriting status."""\n        case = await self.get_case(pattern_key)\n        if case and case.get("status") in _INACTIVE_NOTIFICATION_STATUSES:\n            await self._dismiss_owned_notification(pattern_key, case)\n            return False\n        return await super().publish_case(pattern_key, force=force)\n\n'),
          ]
          prepared = {}
          for name, before, after, anchor, insertion in edits:
              path = Path(name)
              data = path.read_text()
              assert hashlib.sha256(data.encode()).hexdigest() == before, name
              assert data.count(anchor) == 1, name
              updated = data.replace(anchor, insertion + anchor)
              assert hashlib.sha256(updated.encode()).hexdigest() == after, name
              prepared[path] = updated
          for path, content in prepared.items():
              path.write_text(content)
          PY
      - name: Install hash-locked wheels
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r autodoctor/requirements-test.txt
      - name: Compile and run full tests
        run: |
          python -m compileall -q autodoctor/app autodoctor/tests
          python -m pytest -q autodoctor/tests
          git diff --check
      - name: Publish corrected source and remove temporary workflow
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/backup-first-diagnostic-repair'
          git rm -- .github/workflows/apply-notification-review.yml
          git add autodoctor/app/autodoctor/backup_executor.py autodoctor/app/autodoctor/case_lifecycle.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Synchronize verified and interrupted repair notifications promptly'
          git push origin HEAD:refs/heads/feat/backup-first-diagnostic-repair
