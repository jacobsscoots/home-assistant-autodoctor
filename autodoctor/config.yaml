name: "AutoDoctor"
version: "0.4.7"
slug: "autodoctor"
description: >-
  Watches Home Assistant system log events, groups recurring failures into incident
  cases, proactively triages active backlog cases within existing AI safety limits,
  repairs stale case-to-fingerprint backlog drift without synthesizing evidence,
  resolves supported integration targets privately without exposing config-entry IDs
  to the AI, recovers interrupted investigations and AI usage reservations after
  restart, gathers bounded read-only diagnostics, produces conservative repair plans,
  and can execute a tiny approval-gated deterministic repair allowlist.
url: "https://github.com/jacobsscoots/home-assistant-autodoctor"
startup: application
boot: auto
init: false
arch:
  - amd64
  - aarch64
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:doctor
panel_title: AutoDoctor
options:
  min_level: "ERROR"
  min_occurrences_for_ai: 2
  max_incidents_retained: 5000
  analysis_cooldown_seconds: 900
  max_ai_analyses_per_hour: 12
  max_ai_analyses_per_family_per_hour: 2
  ai_startup_backlog_grace_seconds: 300
  case_backlog_triage_enabled: true
  case_backlog_triage_interval_seconds: 60
  case_backlog_triage_max_per_cycle: 1
  ai_provider: "none"
  ai_model: ""
  ai_effort: "low"
  openai_api_key: ""
  anthropic_api_key: ""
  ai_budget_enabled: false
  ai_monthly_budget_usd: 0.0
  ai_monthly_stop_usd: 0.0
  ai_input_cost_per_million_usd: 0.0
  ai_output_cost_per_million_usd: 0.0
  memory_enabled: true
  memory_seed_enabled: false
  memory_max_items: 5
  memory_max_chars: 6000
  memory_ai_hypothesis_expiry_days: 30
  memory_quiet_outcome_seconds: 86400
  memory_worsened_recurrences: 10
  mcp_enabled: false
  mcp_url: ""
  mcp_token: ""
  notify_on_new_incident: true
  repair_executor_enabled: false
  repair_verification_seconds: 120
  auto_apply_low_risk: false
schema:
  min_level: "list(WARNING|ERROR)"
  min_occurrences_for_ai: "int(1,20)"
  max_incidents_retained: "int(100,50000)"
  analysis_cooldown_seconds: "int(60,86400)"
  max_ai_analyses_per_hour: "int(1,100)"
  max_ai_analyses_per_family_per_hour: "int(1,100)"
  ai_startup_backlog_grace_seconds: "int(0,3600)"
  case_backlog_triage_enabled: bool
  case_backlog_triage_interval_seconds: "int(30,3600)"
  case_backlog_triage_max_per_cycle: "int(1,10)"
  ai_provider: "list(none|openai|anthropic)"
  ai_model: str
  ai_effort: "list(low|medium|high)"
  openai_api_key: password
  anthropic_api_key: password
  ai_budget_enabled: bool
  ai_monthly_budget_usd: "float(0,10000)"
  ai_monthly_stop_usd: "float(0,10000)"
  ai_input_cost_per_million_usd: "float(0,10000)"
  ai_output_cost_per_million_usd: "float(0,10000)"
  memory_enabled: bool
  memory_seed_enabled: bool
  memory_max_items: "int(1,20)"
  memory_max_chars: "int(500,20000)"
  memory_ai_hypothesis_expiry_days: "int(1,365)"
  memory_quiet_outcome_seconds: "int(3600,2592000)"
  memory_worsened_recurrences: "int(2,1000)"
  mcp_enabled: bool
  mcp_url: password
  mcp_token: password
  notify_on_new_incident: bool
  repair_executor_enabled: bool
  repair_verification_seconds: "int(30,3600)"
  auto_apply_low_risk: bool
