configuration:
  min_level:
    name: Minimum log level
    description: ERROR is recommended initially to avoid analysing noisy warnings.
  min_occurrences_for_ai:
    name: Occurrences before AI analysis
    description: Repeated non-critical incidents must reach this count before an AI call.
  analysis_cooldown_seconds:
    name: Per-incident AI attempt cooldown
    description: Minimum seconds before the same incident fingerprint can make another AI attempt, including failures or budget blocks.
  max_ai_analyses_per_hour:
    name: AI attempts per hour
    description: Global attempt-rate protection, including budget-blocked attempts, independent from the monthly budget.
  max_ai_analyses_per_family_per_hour:
    name: AI attempts per incident family per hour
    description: Fairness cap that prevents one noisy logger/integration family from consuming the whole global hourly allowance.
  ai_startup_backlog_grace_seconds:
    name: AI startup backlog grace
    description: Seconds after startup during which old incidents keep recording locally but are deferred from AI; incidents first seen after startup remain eligible.
  ai_provider:
    name: AI provider
    description: Monitor only, OpenAI API, or Anthropic API.
  ai_model:
    name: AI model
    description: Exact provider model ID. Required whenever an AI provider is enabled.
  ai_effort:
    name: AI effort
    description: Low is recommended for routine triage; raise only for difficult incidents.
  openai_api_key:
    name: OpenAI API key
  anthropic_api_key:
    name: Anthropic API key
  ai_budget_enabled:
    name: Enable AI budget guard
    description: Must be enabled before an external AI provider can start.
  ai_monthly_budget_usd:
    name: External monthly budget (USD)
    description: Reference ceiling for the provider project; AutoDoctor requires a lower internal stop threshold.
  ai_monthly_stop_usd:
    name: AutoDoctor monthly stop (USD)
    description: Internal hard stop. Must be greater than zero and lower than the external monthly budget.
  ai_input_cost_per_million_usd:
    name: Input price per million tokens (USD)
    description: Enter the current published input price for the exact configured model.
  ai_output_cost_per_million_usd:
    name: Output price per million tokens (USD)
    description: Enter the current published output price for the exact configured model.
  memory_enabled:
    name: Enable local AutoDoctor memory
    description: Retrieves bounded, privacy-safe historical knowledge and observed topology from the local SQLite database before AI diagnosis.
  memory_max_items:
    name: Memory items per AI diagnosis
    description: Maximum number of ranked historical knowledge records inserted into one AI prompt.
  memory_max_chars:
    name: Memory character budget per AI diagnosis
    description: Hard character cap for historical knowledge inserted into one AI prompt.
  memory_ai_hypothesis_expiry_days:
    name: AI hypothesis memory expiry
    description: Days before an unverified AI diagnosis becomes stale and is excluded from retrieval unless replaced by newer evidence.
  memory_quiet_outcome_seconds:
    name: Quiet outcome window
    description: If a diagnosed fingerprint does not recur for this long, memory records a cautious quiet outcome; this is not proof of a fix.
  memory_worsened_recurrences:
    name: Recurrences considered worsening
    description: Number of post-diagnosis recurrences that promotes outcome feedback from continued to worsened-by-recurrence.
  mcp_enabled:
    name: Enable Home Assistant MCP enrichment
  mcp_url:
    name: MCP URL
  mcp_token:
    name: Dedicated MCP Long-Lived Access Token
  notify_on_new_incident:
    name: Notify on new incident
  auto_apply_low_risk:
    name: Auto-apply low-risk repairs
    description: Reserved for the validated executor. v0.1.5 still cannot apply changes.
