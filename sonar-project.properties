# Home Assistant add-ons run on the official S6-based base image and AutoDoctor needs
# Supervisor-managed /data access. Running this Dockerfile as root is an intentional,
# platform-constrained exception. Sonar's S6471 is a Security Hotspot rather than a
# normal issue, so generic issue-ignore rules do not apply to it. Exclude only this
# Dockerfile from Sonar static analysis and cover it instead with CI's build + real
# container-start smoke test, which verifies the runtime user and required files.
sonar.exclusions=autodoctor/Dockerfile
